<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jobs — CareerPilot</title>
  <meta name="description" content="Browse, search, and manage job postings." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="page">
    <header class="masthead">
      <span class="index">04 / JOBS</span>
      <span class="brand"><span class="brand__text">AI Resume Analyzer</span></span>
      <nav class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="matching.html">Matching</a>
        <button class="logout-btn" id="logout-btn">Log out</button>
      </nav>
    </header>

    <main class="jobs-page">
      
      <section class="search-section">
        <h1>Job Board</h1>
        <div class="search-bar">
          <div class="search-field">
            <label for="search-q">Keyword</label>
            <input type="text" id="search-q" placeholder="Title, company, description…" />
          </div>
          <div class="search-field">
            <label for="search-location">Location</label>
            <input type="text" id="search-location" placeholder="e.g. Cairo, Remote" />
          </div>
          <div class="search-field">
            <label for="search-skill">Skill</label>
            <input type="text" id="search-skill" placeholder="e.g. Python, React" />
          </div>
          <button class="primary search-btn" id="search-btn">Search</button>
          <button class="toggle-btn" id="clear-search" style="display:none;">Clear</button>
        </div>
        <div id="application-resume-wrap" class="field" style="display:none;max-width:420px;margin-top:14px;">
          <label for="application-resume">CV used for recommendations and Apply</label>
          <select id="application-resume"></select>
        </div>
        <div id="jobs-match-status" class="meta" style="margin-top:10px;">Select an analyzed CV to load the top-five job recommendations and unlock Apply.</div>
      </section>

      <div id="jobs-message" class="message"></div>

      <section class="add-job-section" id="add-job-section" style="display:none;">
        <button class="toggle-btn" id="toggle-add-job">Add Job Posting</button>
        <div id="add-job-form-wrap" class="add-job-form-wrap" style="display:none;">
          <h2>New Job Posting</h2>
          <form id="add-job-form">
            <div class="form-row">
              <div class="field">
                <label for="job-title">Title *</label>
                <input type="text" id="job-title" required />
              </div>
              <div class="field">
                <label for="job-company">Company</label>
                <input type="text" id="job-company" />
              </div>
            </div>
            <div class="form-row">
              <div class="field">
                <label for="job-location">Location</label>
                <input type="text" id="job-location" />
              </div>
              <div class="field">
                <label for="job-skills">Required Skills (comma-separated)</label>
                <input type="text" id="job-skills" placeholder="Python, FastAPI, SQL" />
              </div>
            </div>
            <div class="field">
              <label for="job-preferred-skills">Preferred Skills (comma-separated)</label>
              <input type="text" id="job-preferred-skills" placeholder="Docker, AWS" />
            </div>
            <div class="field">
              <label for="job-description">Description *</label>
              <textarea id="job-description" rows="4" required></textarea>
            </div>
            <div class="form-row">
              <div class="field">
                <label for="job-experience-years">Required experience</label>
                <input type="text" id="job-experience-years" placeholder="e.g. 3+ years" />
              </div>
              <div class="field">
                <label for="job-education-required">Required education</label>
                <input type="text" id="job-education-required" placeholder="e.g. Bachelor's degree" />
              </div>
            </div>
            <div class="form-row">
              <div class="field">
                <label for="job-deadline">Application deadline</label>
                <input type="datetime-local" id="job-deadline" />
              </div>
              <div class="field">
                <label for="job-max-applications">Maximum applications</label>
                <input type="number" id="job-max-applications" min="1" step="1" />
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" class="primary" id="add-job-btn">Create Job</button>
              <button type="button" class="toggle-btn" id="cancel-add-job">Cancel</button>
            </div>
          </form>
        </div>
      </section>

      
      <section class="jobs-list-section">
        <div class="panel-header">
          <h2 id="jobs-heading">All Jobs</h2>
          <span class="resume-count" id="jobs-count">0</span>
        </div>
        <div id="jobs-list" class="jobs-list">
          <p class="empty-state" id="jobs-empty">No job postings available.</p>
        </div>
      </section>
    </main>
  </div>

  
  <div id="edit-modal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <h2>Edit Job Posting</h2>
      <form id="edit-job-form">
        <input type="hidden" id="edit-job-id" />
        <div class="form-row">
          <div class="field">
            <label for="edit-title">Title</label>
            <input type="text" id="edit-title" />
          </div>
          <div class="field">
            <label for="edit-company">Company</label>
            <input type="text" id="edit-company" />
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="edit-location">Location</label>
            <input type="text" id="edit-location" />
          </div>
          <div class="field">
            <label for="edit-skills">Required Skills (comma-separated)</label>
            <input type="text" id="edit-skills" />
          </div>
        </div>
        <div class="field">
          <label for="edit-preferred-skills">Preferred Skills (comma-separated)</label>
          <input type="text" id="edit-preferred-skills" />
        </div>
        <div class="field">
          <label for="edit-description">Description</label>
          <textarea id="edit-description" rows="4"></textarea>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="edit-experience-years">Required experience</label>
            <input type="text" id="edit-experience-years" />
          </div>
          <div class="field">
            <label for="edit-education-required">Required education</label>
            <input type="text" id="edit-education-required" />
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="edit-deadline">Application deadline</label>
            <input type="datetime-local" id="edit-deadline" />
          </div>
          <div class="field">
            <label for="edit-max-applications">Maximum applications</label>
            <input type="number" id="edit-max-applications" min="1" step="1" />
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="primary">Save Changes</button>
          <button type="button" class="toggle-btn" id="cancel-edit">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/jobs.js"></script>
</body>

</html>
