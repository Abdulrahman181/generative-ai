<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — CareerPilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="page">
    <header class="masthead">
      <span class="index">01 / AUTH</span>
      <span class="brand"><span class="brand__text">AI Resume Analyzer</span></span>
    </header>

    <main class="auth-shell">
      <div class="auth-card">
        <p class="eyebrow">Sign in</p>
        <h1>Welcome back</h1>
        <p class="sub">Log in to reach your dashboard.</p>

        <div id="message" class="message"></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="identifier">Username or email</label>
            <input type="text" id="identifier" name="identifier" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required />
          </div>
          <button type="submit" class="primary" id="submit-btn">Log in</button>
        </form>

        <p class="switch-link">No account yet? <a href="register.html">Register</a></p>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>

</html>
